# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy ASP.Net Core app to Azure Web App - msdocs-core-sql-CAR-group
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.*
      
      - name: Generate migrations bundle
        working-directory: ./Car_TARge24
        run: dotnet ef migrations bundle --project Car_TARge24.Data/Car_TARge24.Data.csproj --startup-project Car_TARge24/Car_TARge24.csproj --self-contained -r win-x64 -o migrationsbundle
        
      - name: Build with dotnet
        run: dotnet build --configuration Release
        working-directory: ./Car_TARge24
        
      - name: dotnet publish
        run: dotnet publish Car_TARge24/Car_TARge24.csproj -c Release -o ${{github.workspace}}/myapp
        working-directory: ./Car_TARge24
      
      - name: Copy migrations bundle to output
        run: cp ./Car_TARge24/migrationsbundle.exe ${{github.workspace}}/myapp/
        
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{github.workspace}}/myapp
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A287F0F59C7F4B6980258F4827291F59 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3A4E9FA1259C47D3918441CEE39F1CD5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9E9F8984E4744561BB15DDC81088A1EB }}
          
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'msdocs-core-sql-CAR-group'
          slot-name: 'Production'
          package: .

